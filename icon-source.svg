<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ChatGPT Bulk Delete Icon</title>
  <desc id="desc">Stacked chat cards with a red delete badge, designed for the ChatGPT Bulk Delete extension.</desc>
  <defs>
    <linearGradient id="bg" x1="72" y1="56" x2="446" y2="456" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#7f1d1d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#020617" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect x="40" y="40" width="432" height="432" rx="128" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <rect x="118" y="124" width="194" height="116" rx="40" fill="#ffffff" opacity="0.96"/>
    <rect x="158" y="188" width="194" height="116" rx="40" fill="#e5e7eb" opacity="0.98"/>
    <rect x="198" y="252" width="194" height="116" rx="40" fill="#cbd5e1"/>
  </g>

  <rect x="150" y="164" width="102" height="18" rx="9" fill="#0f172a" opacity="0.78"/>
  <rect x="190" y="228" width="102" height="18" rx="9" fill="#0f172a" opacity="0.66"/>
  <rect x="230" y="292" width="102" height="18" rx="9" fill="#0f172a" opacity="0.54"/>

  <circle cx="374" cy="374" r="74" fill="#ef4444"/>
  <rect x="330" y="360" width="88" height="28" rx="14" fill="#ffffff"/>
</svg>
