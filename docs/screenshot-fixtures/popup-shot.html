<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Popup Screenshot</title>
    <link rel="stylesheet" href="../../popup.css" />
    <style>
      html {
        height: 100%;
        background:
          radial-gradient(circle at top left, rgba(16, 163, 127, 0.16), transparent 35%),
          linear-gradient(180deg, #111827 0%, #09090b 100%);
      }

      body {
        margin: 0;
        min-height: 100%;
        display: grid;
        place-items: center;
        background: transparent;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
    </style>
  </head>
  <body>
    <main class="popup">
      <header class="popup__header">
        <img class="popup__icon" src="../../icons/icon-48.png" alt="" />
        <div>
          <h1 class="popup__title">ChatGPT Bulk Delete</h1>
          <p class="popup__subtitle">v1.0.0</p>
        </div>
      </header>

      <section class="popup__section">
        <label class="popup__toggle">
          <span>
            <span class="popup__toggle-title">Show toolbar on ChatGPT</span>
            <span class="popup__toggle-note">Hide or show the in-page bulk delete UI.</span>
          </span>
          <input id="toolbar-toggle" type="checkbox" checked />
          <span class="popup__switch" aria-hidden="true"></span>
        </label>
      </section>

      <section class="popup__section popup__section--compact">
        <p class="popup__meta">Local-only. Delete is permanent.</p>
      </section>

      <nav class="popup__links" aria-label="Extension links">
        <a class="popup__link" href="#">Privacy</a>
        <a class="popup__link" href="#">License</a>
        <a class="popup__link" href="#">Terms</a>
        <a class="popup__link" href="#">Report bug</a>
      </nav>
    </main>
  </body>
</html>
