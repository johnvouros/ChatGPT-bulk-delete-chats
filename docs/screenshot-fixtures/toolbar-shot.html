<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Toolbar Screenshot</title>
    <link rel="stylesheet" href="../../styles.css" />
    <style>
      html {
        width: 1440px;
        height: 430px;
        overflow: hidden;
        background:
          radial-gradient(circle at 20% 20%, rgba(16, 163, 127, 0.14), transparent 28%),
          radial-gradient(circle at 80% 10%, rgba(127, 29, 29, 0.18), transparent 22%),
          linear-gradient(180deg, #0f172a 0%, #111827 45%, #020617 100%);
        background-color: #020617;
      }

      body {
        margin: 0;
        width: 1440px;
        height: 430px;
        overflow: hidden;
        background:
          radial-gradient(circle at 20% 20%, rgba(16, 163, 127, 0.14), transparent 28%),
          radial-gradient(circle at 80% 10%, rgba(127, 29, 29, 0.18), transparent 22%),
          linear-gradient(180deg, #0f172a 0%, #111827 45%, #020617 100%);
        background-color: #020617;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 48px 24px;
      }

      #gpt-bulk-delete-root {
        position: static;
        inset: auto;
        display: block;
        width: min(1180px, 100%);
        left: auto;
        right: auto;
        pointer-events: auto;
      }

      .gptbd-toolbar {
        margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <div id="gpt-bulk-delete-root">
      <div class="gptbd-toolbar">
        <div class="gptbd-bar">
          <div class="gptbd-section gptbd-section--id">
            <div class="gptbd-mark" aria-hidden="true">
              <svg class="gptbd-mark-svg" viewBox="0 0 64 64" focusable="false">
                <defs>
                  <linearGradient id="gptbdG" x1="10" y1="8" x2="54" y2="56" gradientUnits="userSpaceOnUse">
                    <stop offset="0" stop-color="#0f172a"/>
                    <stop offset="1" stop-color="#7f1d1d"/>
                  </linearGradient>
                </defs>
                <rect x="6" y="6" width="52" height="52" rx="16" fill="url(#gptbdG)"/>
                <rect x="16" y="16" width="24" height="15" rx="6" fill="#fff" opacity="0.96"/>
                <rect x="21" y="24" width="24" height="15" rx="6" fill="#e5e7eb" opacity="0.98"/>
                <rect x="26" y="32" width="24" height="15" rx="6" fill="#cbd5e1"/>
                <rect x="19" y="20" width="14" height="2.8" rx="1.4" fill="#0f172a" opacity="0.78"/>
                <rect x="24" y="28" width="14" height="2.8" rx="1.4" fill="#0f172a" opacity="0.68"/>
                <rect x="29" y="36" width="14" height="2.8" rx="1.4" fill="#0f172a" opacity="0.58"/>
                <circle cx="47" cy="47" r="9" fill="#ef4444"/>
                <rect x="42" y="45.6" width="10" height="2.8" rx="1.4" fill="#fff"/>
              </svg>
            </div>
            <button type="button" class="gptbd-btn gptbd-btn--toggle" data-active="true">
              <svg class="gptbd-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <rect x="2" y="3" width="10" height="2" rx="1" fill="currentColor"/>
                <rect x="2" y="7" width="10" height="2" rx="1" fill="currentColor"/>
                <rect x="2" y="11" width="6" height="2" rx="1" fill="currentColor"/>
                <rect x="13" y="2" width="2" height="12" rx="1" fill="currentColor" opacity="0.35"/>
              </svg>
              <span>Exit</span>
            </button>
          </div>

          <div class="gptbd-sep" aria-hidden="true"></div>

          <div class="gptbd-section gptbd-section--search">
            <div class="gptbd-search-wrap">
              <svg class="gptbd-search-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <circle cx="6.5" cy="6.5" r="4" stroke="currentColor" stroke-width="1.5"/>
                <path d="M10 10L13.5 13.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
              <input type="text" class="gptbd-search" value="invoice 2024" />
              <button type="button" class="gptbd-search-clear" aria-label="Clear search" title="Clear filter">
                <svg viewBox="0 0 12 12" fill="none" aria-hidden="true">
                  <path d="M2 2l8 8M10 2L2 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
              </button>
              <button type="button" class="gptbd-search-exact" data-active="true">Exact</button>
            </div>
          </div>

          <div class="gptbd-sep" aria-hidden="true"></div>

          <div class="gptbd-section gptbd-section--sync">
            <button type="button" class="gptbd-btn gptbd-btn--chip">
              <svg class="gptbd-icon gptbd-icon--sync" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path d="M13.5 8A5.5 5.5 0 0 1 3 10.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                <path d="M2.5 8A5.5 5.5 0 0 1 13 5.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                <path d="M11 3l2 2.5L10.5 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M5 13L3 10.5 5.5 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <span>Resync</span>
            </button>
            <div class="gptbd-sync-meta">
              <span class="gptbd-meta-pill">8,412 cached</span>
              <button type="button" class="gptbd-cache-clear" title="Clear local cache" aria-label="Clear local cache"></button>
              <span class="gptbd-meta-dot" aria-hidden="true">·</span>
              <span class="gptbd-meta-text">Mar 30, 5:25 PM</span>
            </div>
          </div>

          <div class="gptbd-sep" aria-hidden="true"></div>

          <div class="gptbd-section gptbd-section--act">
            <span class="gptbd-count" data-has-selection="true">3 selected</span>
            <button type="button" class="gptbd-btn gptbd-btn--delete">
              <svg class="gptbd-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path d="M3 4h10M6 4V3h4v1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M4.5 4l.8 8.5a1 1 0 0 0 1 .9h3.4a1 1 0 0 0 1-.9L11.5 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
              <span>Delete 3</span>
            </button>
          </div>
        </div>

        <div class="gptbd-submeta">
          <div class="gptbd-submeta-left">
            <span class="gptbd-meta-text">local-only</span>
            <span class="gptbd-meta-dot">·</span>
            <span class="gptbd-meta-text">delete is permanent</span>
            <span class="gptbd-meta-dot">·</span>
            <span class="gptbd-meta-text">12 matches in year 2024</span>
          </div>
          <div class="gptbd-submeta-right">
            <span class="gptbd-meta-text">v1.0.0</span>
            <span class="gptbd-meta-dot" aria-hidden="true">·</span>
            <a class="gptbd-submeta-link" href="#">Privacy</a>
            <span class="gptbd-meta-dot" aria-hidden="true">·</span>
            <a class="gptbd-submeta-link" href="#">License</a>
            <span class="gptbd-meta-dot" aria-hidden="true">·</span>
            <a class="gptbd-submeta-link" href="#">Terms</a>
            <span class="gptbd-meta-dot" aria-hidden="true">·</span>
            <a class="gptbd-submeta-link" href="#">Report bug</a>
            <span class="gptbd-meta-dot" aria-hidden="true">·</span>
            <button type="button" class="gptbd-submeta-toggle">Hide</button>
          </div>
        </div>

        <div class="gptbd-results-actions" data-visible="true">
          <div class="gptbd-results-actions__left">
            <div class="gptbd-year-filters" role="group" aria-label="Filter cached chats by year">
              <button type="button" class="gptbd-year-chip">All</button>
              <button type="button" class="gptbd-year-chip" data-active="true">2024</button>
              <button type="button" class="gptbd-year-chip">2023</button>
              <button type="button" class="gptbd-year-chip">2022</button>
            </div>
          </div>
          <div class="gptbd-results-actions__right">
            <button type="button" class="gptbd-results-action">Hide list</button>
            <button type="button" class="gptbd-results-action">Newest first</button>
            <button type="button" class="gptbd-results-action">All</button>
            <button type="button" class="gptbd-results-action">Clear</button>
          </div>
        </div>

        <div class="gptbd-results" data-visible="true">
          <div class="gptbd-results-header" aria-hidden="true">
            <span class="gptbd-results-header__title">Chat</span>
            <span class="gptbd-results-header__date">Date</span>
            <span class="gptbd-results-header__open">Open</span>
          </div>

          <div class="gptbd-result">
            <label class="gptbd-result-main">
              <input type="checkbox" class="gptbd-result-checkbox" checked />
              <span class="gptbd-result-title">Invoice follow-up with vendor about March billing discrepancies</span>
            </label>
            <span class="gptbd-result-date">Mar 28, 2024</span>
            <a class="gptbd-result-open" href="#">Open ↗</a>
          </div>

          <div class="gptbd-result">
            <label class="gptbd-result-main">
              <input type="checkbox" class="gptbd-result-checkbox" checked />
              <span class="gptbd-result-title">Quarterly invoice export cleanup and duplicate line item review</span>
            </label>
            <span class="gptbd-result-date">Feb 16, 2024</span>
            <a class="gptbd-result-open" href="#">Open ↗</a>
          </div>

          <div class="gptbd-result">
            <label class="gptbd-result-main">
              <input type="checkbox" class="gptbd-result-checkbox" />
              <span class="gptbd-result-title">Invoice automation brainstorm for the finance inbox archive</span>
            </label>
            <span class="gptbd-result-date">Jan 9, 2024</span>
            <a class="gptbd-result-open" href="#">Open ↗</a>
          </div>

          <div class="gptbd-result">
            <label class="gptbd-result-main">
              <input type="checkbox" class="gptbd-result-checkbox" checked />
              <span class="gptbd-result-title">Legacy invoice wording changes before year-end handoff</span>
            </label>
            <span class="gptbd-result-date">Dec 11, 2023</span>
            <a class="gptbd-result-open" href="#">Open ↗</a>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
