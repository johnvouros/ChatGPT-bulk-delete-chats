<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Delete Warning Screenshot</title>
    <link rel="stylesheet" href="../../styles.css" />
    <style>
      html {
        height: 100%;
        background:
          radial-gradient(circle at top left, rgba(239, 68, 68, 0.15), transparent 32%),
          linear-gradient(180deg, #0b1120 0%, #09090b 100%);
      }

      body {
        margin: 0;
        min-height: 100%;
        display: grid;
        place-items: center;
        background: transparent;
      }

      .gptbd-modal {
        position: static;
        inset: auto;
        display: flex;
        pointer-events: auto;
      }

      .gptbd-modal__backdrop {
        display: none;
      }

      .gptbd-modal__panel {
        animation: none;
      }
    </style>
  </head>
  <body>
    <div class="gptbd-modal" data-visible="true" role="dialog" aria-modal="true">
      <button type="button" class="gptbd-modal__backdrop" tabindex="-1"></button>
      <div class="gptbd-modal__panel">
        <div class="gptbd-modal__header">
          <div class="gptbd-modal__icon-wrap" aria-hidden="true">
            <svg viewBox="0 0 20 20" fill="none" class="gptbd-modal__icon">
              <path d="M10 3L17.66 17H2.34L10 3Z" stroke="#ef4444" stroke-width="1.5" stroke-linejoin="round"/>
              <path d="M10 8v4" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round"/>
              <circle cx="10" cy="14.5" r=".75" fill="#ef4444"/>
            </svg>
          </div>
          <div>
            <h2 class="gptbd-modal__title">Delete 3 conversations?</h2>
            <p class="gptbd-modal__subtitle">Permanent. ChatGPT does not support undo.</p>
          </div>
        </div>

        <div class="gptbd-modal__preview">
          <div class="gptbd-modal__preview-item">
            <span class="gptbd-modal__preview-bullet" aria-hidden="true"></span>
            <span class="gptbd-modal__preview-text">Invoice follow-up with vendor about March billing discrepancies</span>
          </div>
          <div class="gptbd-modal__preview-item">
            <span class="gptbd-modal__preview-bullet" aria-hidden="true"></span>
            <span class="gptbd-modal__preview-text">Quarterly invoice export cleanup and duplicate line item review</span>
          </div>
          <div class="gptbd-modal__preview-item">
            <span class="gptbd-modal__preview-bullet" aria-hidden="true"></span>
            <span class="gptbd-modal__preview-text">Legacy invoice wording changes before year-end handoff</span>
          </div>
        </div>

        <div class="gptbd-modal__warning">
          <p class="gptbd-modal__warning-text">Delete is permanent and cannot be recovered.</p>
          <label class="gptbd-modal__check">
            <input type="checkbox" class="gptbd-modal__check-input" checked />
            <span class="gptbd-modal__check-label">I understand this delete is permanent and cannot be recovered.</span>
          </label>
          <label class="gptbd-modal__check">
            <input type="checkbox" class="gptbd-modal__check-input" />
            <span class="gptbd-modal__check-label">Don't show me this warning again.</span>
          </label>
        </div>

        <div class="gptbd-modal__footer">
          <button type="button" class="gptbd-btn gptbd-btn--cancel">Cancel</button>
          <button type="button" class="gptbd-btn gptbd-btn--delete-confirm">
            <span>Delete 3 conversations</span>
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
