<svg width="720" height="120" viewBox="0 0 720 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Chrome and Firefox support</title>
  <desc id="desc">Decorative banner showing ChatGPT Bulk Delete works on Chrome and Firefox.</desc>
  <defs>
    <linearGradient id="bg" x1="32" y1="20" x2="688" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="chromeRingA" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#EA4335"/>
      <stop offset="0.5" stop-color="#FBBC05"/>
      <stop offset="1" stop-color="#34A853"/>
    </linearGradient>
    <linearGradient id="firefoxA" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFB347"/>
      <stop offset="0.55" stop-color="#FF7139"/>
      <stop offset="1" stop-color="#A13CFF"/>
    </linearGradient>
    <linearGradient id="pill" x1="184" y1="28" x2="560" y2="92" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1220"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="720" height="120" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="20" y="16" width="680" height="88" rx="24" fill="url(#bg)"/>
    <rect x="20.75" y="16.75" width="678.5" height="86.5" rx="23.25" stroke="white" stroke-opacity="0.08" stroke-width="1.5"/>

    <g transform="translate(56 28)">
      <circle cx="32" cy="32" r="30" fill="url(#chromeRingA)"/>
      <circle cx="32" cy="32" r="15" fill="#4285F4"/>
      <circle cx="32" cy="32" r="8" fill="#EAF2FF"/>
      <path d="M32 2A30 30 0 0 1 58 17H31Z" fill="#EA4335"/>
      <path d="M58 17A30 30 0 0 1 39 60L31 46Z" fill="#34A853"/>
      <path d="M39 60A30 30 0 0 1 6 20H22Z" fill="#FBBC05"/>
    </g>

    <g transform="translate(118 28)">
      <circle cx="32" cy="32" r="30" fill="#151B2D"/>
      <path d="M51 12C43 7 32 8 24 14C15 21 12 35 18 46C25 58 41 60 51 51C57 46 60 37 59 28C57 34 52 37 47 37C39 37 34 30 35 23C35 18 38 14 43 12C46 11 49 11 51 12Z" fill="url(#firefoxA)"/>
      <path d="M47 20C42 17 35 18 30 23C26 27 25 34 28 40C32 47 41 48 47 43C51 39 52 33 51 28C50 31 47 33 44 33C39 33 36 29 36 25C36 22 38 19 41 18C43 17 45 18 47 20Z" fill="#FFD089"/>
    </g>

    <rect x="184" y="28" width="348" height="64" rx="20" fill="url(#pill)"/>
    <rect x="184.75" y="28.75" width="346.5" height="62.5" rx="19.25" stroke="white" stroke-opacity="0.08" stroke-width="1.5"/>

    <text x="214" y="53" fill="#E5EEF9" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="0.16em">BROWSER SUPPORT</text>
    <text x="214" y="78" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="800">Works on Chrome and Firefox</text>

    <rect x="554" y="36" width="114" height="48" rx="16" fill="#0B1220"/>
    <rect x="554.75" y="36.75" width="112.5" height="46.5" rx="15.25" stroke="#22C55E" stroke-opacity="0.45" stroke-width="1.5"/>
    <circle cx="578" cy="60" r="8" fill="#22C55E"/>
    <path d="M575 60L577 62L582 57" stroke="#0B1220" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="593" y="66" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Same ZIP</text>
  </g>
</svg>
